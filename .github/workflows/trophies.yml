name: Refresh trophies

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install refresh-trophies dependencies
        run: npm ci
        working-directory: scripts/refresh-trophies

      - name: Regenerate trophies.json
        env:
          NPSSO: ${{ secrets.NPSSO }}
        run: node index.mjs
        working-directory: scripts/refresh-trophies

      - name: Commit trophies.json if changed
        run: |
          if ! git diff --quiet -- site/src/jsMain/resources/public/trophies.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/src/jsMain/resources/public/trophies.json
            git commit -m "chore: refresh trophies.json"
            git push
          else
            echo "trophies.json unchanged, nothing to commit"
          fi
