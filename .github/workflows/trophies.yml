name: Refresh trophies

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate trophies.json
        env:
          NPSSO: ${{ secrets.NPSSO }}
        run: |
          # ponytail: blocked on ROADMAP F025 — no psn-api script exists yet.
          # This step becomes the real PSN fetch once F025 ships; until then it's a
          # documented no-op so the schedule/secret wiring is proven independently
          # (spec.md FR-009/FR-010).
          echo "blocked on ROADMAP F025 — psn-api script not yet implemented" && exit 0

      - name: Commit trophies.json if changed
        run: |
          if ! git diff --quiet -- site/src/jsMain/resources/public/trophies.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/src/jsMain/resources/public/trophies.json
            git commit -m "chore: refresh trophies.json"
            git push
          else
            echo "trophies.json unchanged, nothing to commit"
          fi
